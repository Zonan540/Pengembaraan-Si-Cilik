<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BFE6EF">
<meta name="description" content="Game belajar Matematik, Sains dan English untuk kanak-kanak umur 6 hingga 8 tahun. 100% percuma.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Si Cilik">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light}html{-webkit-text-size-adjust:100%}body{margin:0}</style>
<title>Pengembaraan Si Cilik!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: a phone-first children's game. Each screen is one tall column: top bar, one illustrated stage, one task card, the helper at the bottom. Bright daytime kampung look by choice (single theme); the age-8 world swaps to a night-sky palette. */
:root{
  --page:#BFE6EF; --sky:#CDEEF5; --ink:#1F2D45; --ink-soft:#52627C;
  --card:#FFFFFF; --soft:#EEF5F8; --line:#D3DEE4;
  --awning:#E4453B; --awning-pale:#FFF2D6; --awning-deep:#B8322A;
  --wood:#B87A4B; --wood-dark:#8C5733; --wood-light:#DDA56B; --crate:#EBC08A;
  --sun:#FFC83D; --sun-deep:#D99E00;
  --leaf:#23935D; --leaf-pale:#D8F3E6; --leaf-ink:#17724A;
  --try-pale:#FDE7CF; --try-line:#F0C89F;
  --hill:#79C79B; --hill-deep:#58B184; --grass:#A6DDB2; --grass-deep:#86CC97; --dirt:#E9C892; --dirt-edge:#D2A86A;
  --apple:#E8453C; --banana:#FFD23F; --banana-dark:#E8A800; --orange:#FF9A2E;
  --rambutan:#D8343B; --rambutan-hair:#F2685C; --manggis:#5E2752; --manggis-hl:#8A4A7E;
  --coin-hi:#FFFFFF; --coin-mid:#CCD4DB; --coin-lo:#AEB9C3; --coin-rim:#E6ECF0; --coin-shadow:#8E9BA8;
  --belang:#F2992E; --stripe:#4A2A12; --belly:#FFF1DA; --ear-in:#F7C79A; --nose:#E0575F;
  --kancil:#B07A4C; --kancil-dark:#8A5A34; --k-ear-in:#EFB6A2; --blush:#F58A8A;
  --space:#141B3A; --space-2:#26316F; --space-ink:#E9ECFF; --space-soft:#9AA3D6; --space-glow:#6FE3FF;
  --p1:#E4453B; --p2:#3D78C9; --p3:#23935D; --p4:#8E54C4;
  --shade:rgba(31,45,69,.16);
  --font-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:600 16px/1.35 var(--font-body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.night{background:var(--space)}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3,p,ul,ol{margin:0}

.screen{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-block:12px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

/* shared controls */
.top{display:flex;align-items:center;gap:8px}
.top .grow{flex:1;min-width:0}
.rb{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--shade)}
.rb{color:var(--ink)}
.rb svg{width:26px;height:26px}
.ic{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.icf{fill:currentColor;stroke:none}
.ics{fill:none;stroke:var(--awning);stroke-width:2.6;stroke-linecap:round}
.starchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;font:800 20px/1 var(--font-display);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--shade)}
.starchip svg{width:26px;height:26px}
.btn{min-height:56px;border:0;border-radius:18px;padding:12px 18px;font:800 21px/1.1 var(--font-display);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn.primary{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-deep)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.danger{background:var(--awning);color:#fff;box-shadow:0 5px 0 var(--awning-deep)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{border:0;background:none;padding:8px;font:800 15px/1 var(--font-body);color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.uji{display:inline-block;margin-left:6px;background:var(--awning);color:#fff;border-radius:6px;padding:2px 6px;font:800 11px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 55%,var(--grass) 55%,var(--grass-deep) 100%);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .35s}
.splash.out{opacity:0;pointer-events:none}
.splash .sun{position:absolute;top:9%;right:12%;width:64px;height:64px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 12px rgba(255,200,61,.25)}
.logo-a{font:800 30px/1 var(--font-display);color:var(--ink);letter-spacing:.01em}
.logo-b{font:800 66px/.95 var(--font-display);color:var(--awning);text-shadow:0 5px 0 var(--awning-deep);margin-bottom:6px}
.splash .kancil{width:150px;margin-top:6px}
.splash .kancil .k-all{animation:hop 1.1s ease-in-out infinite}
.loadbar{width:220px;max-width:70%;height:16px;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.loadbar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--sun);animation:fill 2.4s linear forwards}
.splash small{font:800 13px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--leaf-ink)}

/* ---------- profiles ---------- */
.brand{font:800 26px/1 var(--font-display)}
.brand b{color:var(--awning)}
.hello{display:flex;align-items:flex-end;gap:12px}
.hello .kancil{flex:none;width:96px}
.hello h1{font:800 32px/1.05 var(--font-display);text-wrap:balance}
.hello p{margin-top:4px;color:var(--ink-soft)}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.player{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 14px;border:0;border-radius:22px;background:var(--card);box-shadow:0 5px 0 var(--shade);cursor:pointer;text-align:center;transition:transform .12s,box-shadow .12s}
.player:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shade)}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 36px/1 var(--font-display);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.pname{max-width:100%;font:800 22px/1.1 var(--font-display);overflow-wrap:anywhere}
.page{font:800 13px/1.2 var(--font-body);color:var(--ink-soft)}
.pstars{display:flex;align-items:center;gap:4px;font:800 15px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pstars svg{width:18px;height:18px}
.player.add{background:transparent;border:3px dashed #8FB9C7;box-shadow:none;justify-content:center;min-height:190px;color:var(--ink)}
.player.add .plus{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:800 40px/1 var(--font-display);color:var(--ink)}
.player.add span{font:800 18px/1.15 var(--font-display)}
.del{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;border-radius:50%;background:var(--awning);color:#fff;font:800 20px/1 var(--font-display);cursor:pointer;display:grid;place-items:center}
.confirm-card{position:absolute;inset:0;border-radius:22px;background:var(--card);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px;text-align:center}
.confirm-card p{font:800 16px/1.25 var(--font-display)}
.confirm-card .btn{min-height:44px;font-size:17px;padding:8px 10px}
.manage-row{display:flex;justify-content:center}

/* ---------- add player ---------- */
.formcard{background:var(--card);border-radius:24px;padding:18px 16px 20px;box-shadow:0 5px 0 var(--shade);display:flex;flex-direction:column;gap:14px}
.formcard h1{font:800 28px/1.1 var(--font-display)}
.lbl{font:800 13px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.field{display:flex;flex-direction:column;gap:8px}
.name-in{width:100%;min-height:58px;border:3px solid var(--line);border-radius:16px;padding:10px 14px;font:800 24px/1.1 var(--font-display);color:var(--ink);background:var(--soft)}
.name-in:focus{outline:none;border-color:var(--ink);background:#fff}
.ages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.agebtn{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border:3px solid var(--line);border-radius:18px;background:var(--soft);cursor:pointer}
.agebtn b{font:800 34px/1 var(--font-display)}
.agebtn span{font:800 12px/1.15 var(--font-body);color:var(--ink-soft)}
.agebtn[aria-pressed="true"]{border-color:var(--ink);background:var(--sun)}
.agebtn[aria-pressed="true"] span{color:var(--ink)}
.err{min-height:20px;color:var(--awning-deep);font:800 15px/1.3 var(--font-body)}

/* ---------- world map ---------- */
.who{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:var(--card);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;box-shadow:0 3px 0 var(--shade)}
.who .avatar{width:38px;height:38px;font-size:20px;box-shadow:none}
.who span{min-width:0;font:800 18px/1 var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.world-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.world-title h1{font:800 30px/1 var(--font-display)}
.world-title p{font:800 13px/1.2 var(--font-body);color:var(--ink-soft)}
.map{position:relative;width:100%;aspect-ratio:400/540;max-width:100%;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 var(--shade)}
.map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.place{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:44%;border:0;background:none;padding:0;cursor:pointer}
.place .art{position:relative;width:62%;transition:transform .15s}
.place .art svg{display:block;width:100%;height:auto;overflow:visible}
.place:active .art{transform:scale(.94)}
.place.open .art{animation:floaty 3.2s ease-in-out infinite}
.plabel{width:100%;background:var(--card);border-radius:16px;padding:7px 8px 8px;text-align:center;box-shadow:0 4px 0 var(--shade)}
.plabel b{display:block;font:800 17px/1.05 var(--font-display)}
.plabel span{display:block;margin-top:3px;font:800 12px/1.15 var(--font-body);color:var(--ink-soft)}
.plabel .pst{display:inline-flex;align-items:center;gap:3px;margin-top:4px;font:800 14px/1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.plabel .pst svg{width:15px;height:15px}
.place.locked .art svg,.place.soon .art svg{filter:grayscale(.85) brightness(1.05);opacity:.75}
.lock{color:#fff;position:absolute;right:-6px;top:-6px;width:38px;height:38px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.lock svg{width:20px!important;height:20px!important}
.soonflag{position:absolute;left:50%;top:-12px;transform:translateX(-50%);white-space:nowrap;background:var(--sun);border-radius:999px;padding:4px 10px;font:800 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 2px 0 var(--sun-deep)}
/* night world */
body.night .world-title h1{color:var(--space-ink)}
body.night .world-title p{color:var(--space-soft)}
body.night .plabel{background:var(--space-2);color:var(--space-ink);box-shadow:0 4px 0 rgba(0,0,0,.35)}
body.night .plabel span{color:var(--space-soft)}
body.night .plabel .pst{color:var(--space-ink)}

/* ---------- level path ---------- */
.zonehead{min-width:0}
.zonehead h1{font:800 24px/1.05 var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zonehead span{font:800 12px/1.2 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.trail{position:relative;width:100%;border-radius:26px;background:linear-gradient(180deg,var(--grass),var(--grass-deep));overflow:hidden;box-shadow:0 6px 0 var(--shade)}
.trail>svg{position:absolute;left:0;top:0;width:100%;display:block}
.road{fill:none;stroke:var(--dirt);stroke-width:30;stroke-linecap:round}
.road-edge{fill:none;stroke:var(--dirt-edge);stroke-width:36;stroke-linecap:round}
.road-dash{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:2 12;stroke-linecap:round;opacity:.7}
.tuft{fill:var(--hill-deep)}
.stop{position:absolute;transform:translate(-50%,-34px);display:flex;flex-direction:column;align-items:center;gap:3px;width:130px}
.stone{position:relative;width:70px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;font:800 30px/1 var(--font-display);cursor:pointer;background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-deep);transition:transform .12s,box-shadow .12s}
.stone:active:not(.locked){transform:translateY(5px);box-shadow:0 1px 0 var(--sun-deep)}
.stone.pass{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-ink)}
.stone.locked{background:#DCE7EC;color:#93A3B2;box-shadow:0 6px 0 #B8C7CF;cursor:pointer}
.stone.locked svg{width:28px;height:28px}
.stone.now::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid #fff;animation:ring 1.6s ease-out infinite}
.minis{display:flex;gap:2px}
.minis svg{width:20px;height:20px}
.ltitle{max-width:100%;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 9px;font:800 11.5px/1.2 var(--font-body);text-align:center}
.marker{position:absolute;width:64px;transform:translate(-50%,-62px);pointer-events:none}
.marker .kancil{width:100%}

/* ---------- play ---------- */
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.75)}
.dot.done{background:var(--leaf)}
.dot.now{background:var(--sun);box-shadow:0 0 0 3px #fff}
.stage{position:relative;border-radius:24px;overflow:hidden;background:var(--sky);box-shadow:0 5px 0 var(--shade);min-height:150px;display:flex;align-items:flex-end;gap:8px;padding:44px 10px 0 12px}
.awning{position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,var(--awning) 0 40px,var(--awning-pale) 40px 80px)}
.awning::after{content:"";position:absolute;left:0;right:0;top:22px;height:13px;background:inherit;
  -webkit-mask:radial-gradient(circle 20px at 20px 0,#000 98%,transparent 100%) 0 0/40px 13px repeat-x;
  mask:radial-gradient(circle 20px at 20px 0,#000 98%,transparent 100%) 0 0/40px 13px repeat-x}
.stage .hillband{position:absolute;left:0;right:0;bottom:0;height:42px;background:var(--hill);border-radius:50% 50% 0 0/40% 40% 0 0}
.bubble{position:relative;z-index:1;flex:1;min-width:0;align-self:center;margin-bottom:16px;background:var(--card);border-radius:18px;padding:11px 13px 12px;box-shadow:0 3px 0 var(--shade)}
.bubble::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left-color:var(--card);border-right:0}
.prompt{font:800 19px/1.25 var(--font-display);text-wrap:pretty}
.tigerbox{position:relative;z-index:1;flex:none;width:118px}
.tigerbox svg{display:block;width:100%;height:auto;overflow:visible}

.qcard{background:var(--card);border-radius:24px;padding:16px 14px 18px;box-shadow:0 5px 0 var(--shade);display:flex;flex-direction:column;gap:14px}
.qvis{display:flex;flex-direction:column;align-items:center;gap:10px}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:300px}
.fr{position:relative;width:52px;height:52px;padding:2px;border:0;background:none;border-radius:14px}
.fr svg{width:100%;height:100%;display:block;overflow:visible}
button.fr{cursor:pointer}
button.fr:active{transform:scale(.9)}
.fr[data-c]::after{content:attr(data-c);position:absolute;right:-4px;top:-6px;min-width:24px;height:24px;border-radius:12px;padding:0 5px;display:grid;place-items:center;background:var(--ink);color:#fff;font:800 14px/1 var(--font-display);animation:pop .25s ease-out}
.fr.gone svg{opacity:.32}
.fr.gone::before{content:"";position:absolute;inset:4px;background:linear-gradient(45deg,transparent 44%,var(--awning) 44%,var(--awning) 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--awning) 44%,var(--awning) 56%,transparent 56%);z-index:1;border-radius:4px}
.pile.md .fr{width:44px;height:44px;padding:1px}
.pile.sm .fr{width:34px;height:34px;padding:1px}
.pile.xs .fr{width:28px;height:28px;padding:0}
.sum{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;width:100%}
.sum .pile{max-width:150px}
.op{font:800 40px/1 var(--font-display);color:var(--ink-soft)}
.eq{font:800 34px/1 var(--font-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.numcard{display:flex;flex-direction:column;align-items:center;justify-content:center;width:120px;height:120px;border-radius:24px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep)}
.numcard b{font:800 64px/.9 var(--font-display)}
.numcard span{font:800 16px/1 var(--font-body)}
.seq{display:flex;align-items:center;gap:6px}
.seq .st{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font:800 36px/1 var(--font-display);box-shadow:0 4px 0 var(--line)}
.seq .st.q{background:var(--sun);box-shadow:0 4px 0 var(--sun-deep)}
.seq .ar{width:18px;height:18px;flex:none}
.seq .ar path{fill:none;stroke:var(--ink-soft);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.item{position:relative;display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:20px;padding:10px 18px 10px 12px}
.item .fr{width:76px;height:76px}
.tag{font:800 30px/1 var(--font-display);background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}

.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-width:0;min-height:72px;border:0;border-radius:18px;background:var(--soft);box-shadow:0 5px 0 var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;transition:transform .12s,box-shadow .12s}
.opt b{font:800 34px/1 var(--font-display);font-variant-numeric:tabular-nums}
.opt small{font:800 13px/1 var(--font-body);color:var(--ink-soft)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.opt:disabled{cursor:default}
.opt.no{background:var(--try-pale);box-shadow:0 5px 0 var(--try-line);opacity:.6;animation:nudge .45s}
.opt.ok{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-ink);animation:pop .4s ease-out}
.opt.ok b,.opt.ok small,.opt.ok span{color:#fff}
.opt.crate{background:var(--crate);box-shadow:0 5px 0 var(--wood-dark);min-height:110px;padding:10px 6px}
.opt.crate.no{background:var(--try-pale);box-shadow:0 5px 0 var(--try-line)}
.opt.crate.ok{background:var(--leaf-pale);box-shadow:0 5px 0 var(--leaf)}
.opt.wide{grid-column:1/-1;min-height:58px}
.opt.wide span{font:800 22px/1 var(--font-display)}
.opt.coinopt{min-height:96px}

.coin{flex:none;display:inline-grid;place-items:center;align-content:center;border-radius:50%;color:var(--ink);background:radial-gradient(circle at 35% 30%,var(--coin-hi),var(--coin-mid) 58%,var(--coin-lo));box-shadow:inset 0 0 0 3px var(--coin-rim),0 3px 0 var(--coin-shadow)}
.coin b{font:800 20px/.9 var(--font-display)}
.coin small{font:800 10px/1 var(--font-body);color:var(--ink)}

textarea.code{width:100%;min-height:84px;border:3px solid var(--line);border-radius:14px;padding:10px;font:600 12px/1.3 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);color:var(--ink);resize:vertical}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw span{font:700 14px/1.3 var(--font-body)}
.tg{flex:none;width:58px;height:32px;border:0;border-radius:16px;background:#C4D3DB;position:relative;cursor:pointer}
.tg::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-pressed="true"]{background:var(--leaf)}
.tg[aria-pressed="true"]::after{transform:translateX(26px)}
.kancil{display:block;width:100%;height:auto;overflow:visible}
.shadow{fill:rgba(31,45,69,.18)}
.k-all{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.k-head{transform-box:fill-box;transform-origin:50% 100%}
.k-body{fill:var(--kancil)} .k-belly{fill:var(--belly)} .k-ear-in{fill:var(--k-ear-in)}
.k-leg{fill:var(--kancil)} .k-hoof{fill:var(--stripe)}
.k-tail{fill:var(--belly);transform-box:fill-box;transform-origin:0% 50%;animation:wag 1.6s ease-in-out infinite}
.k-spot{fill:var(--belly)}
.k-nose{fill:var(--ink)} .k-pupil{fill:var(--ink)} .k-hl{fill:#fff} .k-hl2{fill:#fff;opacity:.9}
.k-mouth{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k-blush{fill:var(--blush);opacity:.5}
.k-tuft{fill:none;stroke:var(--kancil-dark);stroke-width:3;stroke-linecap:round}
.k-scarf{fill:var(--leaf)} .k-scarf2{fill:var(--leaf-ink)}
.k-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
.k-ear{transform-box:fill-box;transform-origin:50% 90%}
.k-ear.l{animation:ear 5.2s ease-in-out infinite}
.k-ear.r{animation:ear 6.1s ease-in-out infinite reverse}
.kancil.happy .k-all{animation:jump .8s ease-out}
.kancil.try .k-head{animation:tilt .9s ease-in-out}
.t-body{fill:var(--belang)} .t-belly{fill:var(--belly)} .t-ear{fill:var(--ear-in)}
.t-nose{fill:var(--nose)} .t-fill{fill:var(--stripe)} .t-tip{fill:var(--stripe)} .t-blush{fill:#F27C7C;opacity:.45}
.t-mouth{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t-pupil{fill:var(--ink)} .t-hl{fill:#fff}
.t-tail{fill:none;stroke:var(--belang);stroke-width:10;stroke-linecap:round}
.t-tail-s{fill:none;stroke:var(--stripe);stroke-width:10;stroke-dasharray:5 13}
.t-tailg{transform-box:fill-box;transform-origin:0% 100%;animation:wag 2.8s ease-in-out infinite}
.t-head{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
.t-eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.tiger{transform-box:fill-box;transform-origin:50% 100%}
.tiger.cheer{animation:jump .85s ease-out}

.spark{position:fixed;left:0;top:0;width:18px;height:18px;pointer-events:none;z-index:90}
.spark svg{width:100%;height:100%;display:block;overflow:visible}

@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes wag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.1,.88)}50%{transform:translateY(-18px) scale(.94,1.08)}80%{transform:translateY(0) scale(1.08,.9)}100%{transform:translateY(0) scale(1,1)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.08,.9)}45%{transform:translateY(-16px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.05,.94)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}60%{transform:rotate(6deg)}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes fadeup{from{opacity:0;transform:translate(var(--tx,0),6px)}to{opacity:1;transform:translate(var(--tx,0),0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fill{to{width:100%}}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.toast{--tx:-50%}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .loadbar i{width:100%}
}
</style>

<script>
(function(){
'use strict';

/* ================= CONFIG (data-driven) ================= */
var PASS = 2;            // bintang minimum untuk buka tahap seterusnya
var PER_LEVEL = 6;       // soalan setiap tahap
var LEVELS_PER_ZONE = 10;
var MAX_PLAYERS = 4;
var STORE_KEY = 'si-cilik-v1';
var UJI = (location.hash === '#uji');
var APP_VER = '5.1';

var AGES = {
  6:{label:'Prasekolah', world:'kampung'},
  7:{label:'Tahun 1',    world:'kampung'},
  8:{label:'Tahun 2',    world:'angkasa'}
};
var WORLDS = {
  kampung:{name:'Kampung Kancil', tag:'Dunia Kancil', zones:['pasar','reban','taman']},
  angkasa:{name:'Stesen Angkasa', tag:'Dunia Robot', zones:['enjin','makmal','komunikasi']}
};
var ZONES = {
  pasar:{name:'Pasar Kancil', subject:'Matematik', art:'stall', x:30, y:78},
  reban:{name:'Reban Si Ayam', subject:'Sains', art:'coop', x:70, y:50},
  taman:{name:'Taman Kata', subject:'English', art:'tree', x:32, y:21},
  enjin:{name:'Bilik Enjin', subject:'Matematik', art:'engine', x:30, y:78},
  makmal:{name:'Makmal Planet', subject:'Sains', art:'lab', x:70, y:50},
  komunikasi:{name:'Pusat Komunikasi', subject:'English', art:'dish', x:32, y:21}
};
var PLAYER_COLORS = ['var(--p1)','var(--p2)','var(--p3)','var(--p4)'];

/* ================= CONTENT: generators ================= */
var FRUITS = {
  epal:{ms:'epal', icon:'i-apple'},
  oren:{ms:'oren', icon:'i-orange'},
  pisang:{ms:'pisang', icon:'i-banana'},
  rambutan:{ms:'rambutan', icon:'i-rambutan'},
  manggis:{ms:'manggis', icon:'i-manggis'}
};
var FK = Object.keys(FRUITS);
var EN = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
var COINS = [5,10,20,50];

function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function range(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r;}
function numOpts(ans,lo,hi){
  var s=[ans],tries=0;
  while(s.length<3&&tries<60){var v=ans+pick([-2,-1,1,2]);if(v>=lo&&v<=hi&&s.indexOf(v)<0)s.push(v);tries++;}
  for(var v2=lo;s.length<3&&v2<=hi;v2++)if(s.indexOf(v2)<0)s.push(v2);
  return s.sort(function(a,b){return a-b;});
}
function numOpt(n){return {v:n,html:'<b>'+n+'</b><small>'+(EN[n]||'')+'</small>'};}
function icon(id){return '<svg viewBox="0 0 48 48" aria-hidden="true"><use href="#'+id+'"/></svg>';}
function pile(f,n,o){
  o=o||{};var h='',gone=o.gone||0,sz=o.size||(n>6?'sm':'');
  for(var i=0;i<n;i++){
    var g=i>=n-gone;
    h+=(o.tap&&!g)?'<button type="button" class="fr" data-act="countfr" aria-label="Kira '+FRUITS[f].ms+'">'+icon(FRUITS[f].icon)+'</button>'
                  :'<span class="fr'+(g?' gone':'')+'">'+icon(FRUITS[f].icon)+'</span>';
  }
  return '<div class="pile '+sz+'">'+h+'</div>';
}
function coinHTML(v,mini){return '<span class="coin c'+v+(mini?' mini':'')+'"><b>'+v+'</b><small>sen</small></span>';}
function countOn(from,steps,dir){var r=[];for(var i=1;i<=steps;i++)r.push(from+dir*i);return r.join(', ');}

var G = {
  count:function(lo,hi){return function(){
    var n=ri(lo,hi),f=pick(FK),ms=FRUITS[f].ms;
    return {key:f+n,prompt:'Berapa biji '+ms+' ada?',visual:pile(f,n,{tap:true}),
      opts:numOpts(n,1,Math.min(10,hi+1)).map(numOpt),ans:n,
      hints:['Tap setiap buah sambil kira: satu, dua, tiga…','Kira perlahan-lahan sampai buah terakhir. Jawapannya '+n+'.'],
      good:'Betul! '+n+', '+EN[n]+'.',en:EN[n]};
  };},
  match:function(){
    var N=ri(1,10),f=pick(FK),ms=FRUITS[f].ms,c=[N];
    var near=shuffle(range(Math.max(1,N-3),Math.min(10,N+3)).filter(function(v){return v!==N;}));
    c.push(near[0],near[1]);c=shuffle(c);
    return {key:'m'+N,prompt:'Tap bakul yang ada '+N+' biji '+ms+'.',
      visual:'<div class="numcard"><b>'+N+'</b><span>'+EN[N]+'</span></div>',
      opts:c.map(function(v){return {v:v,cls:'crate',html:pile(f,v,{size:v>6?'xs':'sm'})};}),ans:N,
      hints:['Kira buah dalam setiap bakul.','Cari bakul yang ada tepat '+N+' biji.'],
      good:'Betul! '+N+', '+EN[N]+'.',en:EN[N]};
  },
  compare:function(){
    var f=pick(FK),a=ri(1,9),b;
    if(Math.random()<0.2)b=a;else{do{b=ri(1,9);}while(b===a);}
    var ask=pick(['lebih','kurang']);
    var ans=a===b?'sama':(ask==='lebih'?(a>b?'a':'b'):(a<b?'a':'b'));
    return {key:a+'-'+b+ask,prompt:ask==='lebih'?'Bakul mana ada lebih banyak buah?':'Bakul mana ada lebih sedikit buah?',
      visual:'',optsCls:'two',
      opts:[{v:'a',cls:'crate',html:pile(f,a,{size:a>4?'sm':'md'})},{v:'b',cls:'crate',html:pile(f,b,{size:b>4?'sm':'md'})},{v:'sama',cls:'wide',html:'<span>Sama banyak</span>'}],
      ans:ans,
      hints:['Kira buah dalam kedua-dua bakul dulu.','Bakul kiri ada '+a+', bakul kanan ada '+b+'.'],
      good:a===b?'Betul! Dua-dua ada '+a+'. Sama banyak.':'Betul! '+a+' dan '+b+'.'};
  },
  seq:function(){
    var dir=pick(['naik','turun']),arr,s;
    if(dir==='naik'){s=ri(1,8);arr=[s,s+1,s+2];}else{s=ri(3,10);arr=[s,s-1,s-2];}
    var blank=pick([0,1,2,2]),ans=arr[blank];
    var ar='<svg class="ar" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3l7 6-7 6"/></svg>';
    var vis='<div class="seq">'+arr.map(function(v,i){return '<span class="st'+(i===blank?' q':'')+'">'+(i===blank?'?':v)+'</span>';}).join(ar)+'</div>';
    return {key:arr.join('')+blank,prompt:dir==='naik'?'Kira menaik. Nombor apa yang hilang?':'Kira menurun. Nombor apa yang hilang?',
      visual:vis,opts:numOpts(ans,1,10).map(numOpt),ans:ans,
      hints:[dir==='naik'?'Kira menaik: setiap nombor tambah satu.':'Kira menurun: setiap nombor kurang satu.',
        'Sebut kuat-kuat: '+arr.map(function(v,i){return i===blank?'…':v;}).join(', ')+'.'],
      good:'Betul! '+ans+', '+EN[ans]+'.',en:EN[ans]};
  },
  add:function(lo,hi){return function(){
    var s=ri(lo,hi),a=ri(1,s-1),b=s-a,f=pick(FK),ms=FRUITS[f].ms,sz=s>6?'sm':'';
    return {key:a+'+'+b,prompt:'Ada '+a+' biji '+ms+', tambah '+b+' lagi. Semuanya berapa?',
      visual:'<div class="sum">'+pile(f,a,{tap:true,size:sz})+'<span class="op">+</span>'+pile(f,b,{tap:true,size:sz})+'</div><div class="eq">'+a+' + '+b+' = ?</div>',
      opts:numOpts(s,1,10).map(numOpt),ans:s,
      hints:['Tap semua buah sambil kira, dari kiri ke kanan.','Mula dari '+a+', kemudian kira '+b+' lagi: '+countOn(a,b,1)+'.'],
      good:'Betul! '+a+' + '+b+' = '+s+'.',en:EN[s]};
  };},
  sub:function(){
    var n=ri(3,10),k=ri(1,Math.min(5,n-1)),r=n-k,f=pick(FK),ms=FRUITS[f].ms;
    return {key:n+'-'+k,prompt:'Ada '+n+' biji '+ms+'. Si Belang ambil '+k+'. Tinggal berapa?',
      visual:pile(f,n,{gone:k,tap:true})+'<div class="eq">'+n+' − '+k+' = ?</div>',
      opts:numOpts(r,0,10).map(numOpt),ans:r,
      hints:['Buah yang dipangkah sudah diambil. Tap dan kira buah yang tinggal.','Mula dari '+n+', kira menurun '+k+' kali: '+countOn(n,k,-1)+'.'],
      good:'Betul! '+n+' − '+k+' = '+r+'.',en:EN[r]};
  },
  coinId:function(i){
    if(i%2===0){
      var v=pick(COINS),o=shuffle([v].concat(shuffle(COINS.filter(function(c){return c!==v;})).slice(0,2)));
      return {key:'c'+v,prompt:'Tap syiling '+v+' sen.',visual:'',optsCls:'',
        opts:o.map(function(c){return {v:c,cls:'coinopt',html:coinHTML(c)};}),ans:v,
        hints:['Lihat nombor pada setiap syiling.','Cari syiling yang tertulis '+v+'.'],
        good:'Betul! Ini syiling '+v+' sen.'};
    }
    var p=shuffle(COINS).slice(0,2),mx=Math.max(p[0],p[1]),mn=Math.min(p[0],p[1]);
    return {key:'b'+p.join('-'),prompt:'Syiling mana yang nilainya lebih besar?',visual:'',optsCls:'two',
      opts:p.map(function(c){return {v:c,cls:'coinopt',html:coinHTML(c)};}),ans:mx,
      hints:['Bandingkan nombor pada syiling.',mx+' sen lebih besar daripada '+mn+' sen.'],
      good:'Betul! '+mx+' sen lebih besar daripada '+mn+' sen.'};
  },
  pay:function(){
    var f=pick(FK),ms=FRUITS[f].ms,price=pick([10,15,20,25,30,35,40,50,60,70]);
    var g=[],r=price;[50,20,10,5].forEach(function(c){while(r>=c){g.push(c);r-=c;}});
    return {kind:'coins',key:'p'+price+f,price:price,
      prompt:'Kau nak beli sebiji '+ms+'. Harganya '+price+' sen. Bayar dengan duit yang tepat.',
      visual:'<div class="item"><span class="fr">'+icon(FRUITS[f].icon)+'</span><span class="tag">'+price+' sen</span></div>',
      hints:['Tap syiling sampai jumlah dalam tangan sama dengan harga.','Cuba '+g.map(function(c){return c+' sen';}).join(' + ')+'.'],
      good:'Betul! '+price+' sen, tepat.'};
  }
};


/* ================= KANDUNGAN: Sains (Reban Si Ayam) ================= */
var ANIM={
  ayam:{ms:'ayam',icon:'a-ayam',d:'ada jambul merah dan paruh'},
  kucing:{ms:'kucing',icon:'a-kucing',d:'ada misai dan telinga yang runcing'},
  ikan:{ms:'ikan',icon:'a-ikan',d:'ada sirip dan ekor'},
  burung:{ms:'burung',icon:'a-burung',d:'ada paruh dan sayap'},
  lembu:{ms:'lembu',icon:'a-lembu',d:'ada tanduk dan hidung merah jambu yang besar'},
  katak:{ms:'katak',icon:'a-katak',d:'ada dua mata besar yang timbul'},
  itik:{ms:'itik',icon:'a-itik',d:'berwarna kuning dengan paruh yang leper'},
  rama:{ms:'rama-rama',icon:'a-rama',d:'ada sayap yang berwarna-warni'}
};
var AK=Object.keys(ANIM);
var THING={
  bunga:{ms:'bunga',icon:'a-bunga'},pokok:{ms:'pokok',icon:'a-pokok'},daun:{ms:'daun',icon:'a-daun'},
  matahari:{ms:'matahari',icon:'a-matahari'},bulan:{ms:'bulan',icon:'a-bulan'},bintang:{ms:'bintang',icon:'i-star'},
  batu:{ms:'batu',icon:'a-batu'},air:{ms:'air',icon:'a-air'}
};
var PARTS={
  mata:{icon:'a-mata',use:'untuk melihat',verb:'melihat'},
  telinga:{icon:'a-telinga',use:'untuk mendengar',verb:'mendengar'},
  hidung:{icon:'a-hidung',use:'untuk menghidu',verb:'menghidu bau'},
  lidah:{icon:'a-lidah',use:'untuk merasa makanan',verb:'merasa makanan'},
  tangan:{icon:'a-tangan',use:'untuk memegang benda',verb:'memegang benda'}
};
var PK=Object.keys(PARTS);
function ic(k){return (ANIM[k]||THING[k]).icon;}
function nm(k){return (ANIM[k]||THING[k]).ms;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function pic(id,capt,size){return '<span class="pic"'+(size?' style="--s:'+size+'px"':'')+'>'+icon(id)+(capt?'<small>'+capt+'</small>':'')+'</span>';}
function picOpt(v,id,capt,size){return {v:v,cls:'picopt',html:pic(id,capt,size)};}
function three(ans,pool){return shuffle([ans].concat(shuffle(pool).slice(0,2)));}
function posWord(i){return ['kiri','tengah','kanan'][i];}
function bigpic(id){return '<div class="bigpic">'+icon(id)+'</div>';}

var FACTS={
  terbang:{q:'Haiwan mana boleh terbang?',yes:['burung','rama'],no:['lembu','kucing','ikan','katak'],h:'Haiwan yang boleh terbang ada sayap.'},
  air:{q:'Haiwan mana hidup dalam air?',yes:['ikan'],no:['lembu','kucing','rama'],h:'Haiwan ini berenang dengan sirip.'},
  rumput:{q:'Haiwan mana makan rumput?',yes:['lembu'],no:['kucing','ikan','katak'],h:'Haiwan ini besar dan selalu ada di padang rumput.'},
  ikanf:{q:'Haiwan mana suka makan ikan?',yes:['kucing'],no:['lembu','rama','ayam'],h:'Haiwan ini ada misai dan suka mengeong.'},
  telur:{q:'Haiwan mana bertelur?',yes:['ayam','itik'],no:['lembu','kucing'],h:'Haiwan ini ada bulu dan paruh.'},
  susu:{q:'Haiwan mana beri kita susu?',yes:['lembu'],no:['ayam','ikan','burung'],h:'Haiwan ini besar dan ada tanduk.'}
};
var LIVE=['ayam','kucing','ikan','burung','bunga','pokok'], DEAD=['batu','air','bulan','matahari'];
var PNEED=[
  {q:'Pokok minum apa supaya hidup?',yes:'air',no:['batu','bulan'],h:'Kita siram pokok dengan ini.'},
  {q:'Pokok perlukan cahaya. Cahaya itu datang dari mana?',yes:'matahari',no:['bulan','batu'],h:'Cahaya ini terang pada waktu siang.'},
  {q:'Tuan kebun siram pokok dengan apa?',yes:'air',no:['batu','matahari'],h:'Ini cecair yang kita minum juga.'}
];

G.sAnimal=function(){
  var k=pick(AK),ch=three(k,AK.filter(function(x){return x!==k;})),i=ch.indexOf(k);
  return {key:'an'+k+ch.join(''),prompt:'Tap '+ANIM[k].ms+'.',visual:'',
    opts:ch.map(function(x){return picOpt(x,ic(x));}),ans:k,
    hints:['Cari haiwan yang '+ANIM[k].d+'.','Gambar '+ANIM[k].ms+' ada di sebelah '+posWord(i)+'.'],
    good:'Betul! Ini '+ANIM[k].ms+'.'};
};
G.sFact=function(keys){return function(){
  var f=FACTS[pick(keys)],k=pick(f.yes),ch=three(k,f.no);
  return {key:f.q+k+ch.join(''),prompt:f.q,visual:'',
    opts:ch.map(function(x){return picOpt(x,ic(x),nm(x));}),ans:k,
    hints:[f.h,'Jawapannya ialah '+nm(k)+'.'],good:'Betul! '+cap(nm(k))+'.'};
};};
G.sBody=function(){
  var k=pick(PK),ch=three(k,PK.filter(function(x){return x!==k;})),i=ch.indexOf(k);
  return {key:'bd'+k+ch.join(''),prompt:'Tap '+k+'.',visual:'',
    opts:ch.map(function(x){return picOpt(x,PARTS[x].icon);}),ans:k,
    hints:['Kita guna '+k+' '+PARTS[k].use+'.','Gambar '+k+' ada di sebelah '+posWord(i)+'.'],
    good:'Betul! Ini '+k+'.'};
};
G.sSense=function(){
  var k=pick(PK),ch=three(k,PK.filter(function(x){return x!==k;}));
  return {key:'ss'+k+ch.join(''),prompt:'Kita guna apa untuk '+PARTS[k].verb+'?',visual:'',
    opts:ch.map(function(x){return picOpt(x,PARTS[x].icon,x);}),ans:k,
    hints:['Fikir: anggota badan mana yang kita guna '+PARTS[k].use+'?','Jawapannya ialah '+k+'.'],
    good:'Betul! Kita guna '+k+' '+PARTS[k].use+'.'};
};
G.sLive=function(){
  var alive=Math.random()<0.55,k=pick(alive?LIVE:DEAD);
  return {key:'lv'+k,prompt:'Adakah '+nm(k)+' benda hidup?',visual:bigpic(ic(k)),optsCls:'two',
    opts:[{v:'ya',cls:'word',html:'<b>Ya, hidup</b>'},{v:'tidak',cls:'word',html:'<b>Tak hidup</b>'}],ans:alive?'ya':'tidak',
    hints:['Benda hidup membesar, makan atau minum, dan boleh membiak.',cap(nm(k))+(alive?' ialah benda hidup.':' bukan benda hidup.')],
    good:'Betul! '+cap(nm(k))+(alive?' ialah benda hidup.':' bukan benda hidup.')};
};
G.sKind=function(){
  var an=Math.random()<0.55,k=pick(an?AK:['bunga','pokok','daun']);
  return {key:'kd'+k,prompt:'Adakah '+nm(k)+' haiwan atau tumbuhan?',visual:bigpic(ic(k)),optsCls:'two',
    opts:[{v:'haiwan',cls:'word',html:'<b>Haiwan</b>'},{v:'tumbuhan',cls:'word',html:'<b>Tumbuhan</b>'}],ans:an?'haiwan':'tumbuhan',
    hints:['Haiwan boleh bergerak ke sana sini. Tumbuhan tumbuh di tanah dan tidak berjalan.',cap(nm(k))+' ialah '+(an?'haiwan.':'tumbuhan.')],
    good:'Betul! '+cap(nm(k))+' ialah '+(an?'haiwan.':'tumbuhan.')};
};
G.sPlant=function(){

var MS_U=['kosong','satu','dua','tiga','empat','lima','enam','tujuh','lapan','sembilan'];
function msNum(n){
  if(n===100)return 'seratus';
  if(n<10)return MS_U[n];
  if(n===10)return 'sepuluh';
  if(n===11)return 'sebelas';
  if(n<20)return MS_U[n-10]+' belas';
  var t=Math.floor(n/10),u=n%10;return MS_U[t]+' puluh'+(u?' '+MS_U[u]:'');
}
function numBtn(n){return {v:n,cls:'big',html:'<b>'+n+'</b>'};}
function txtOpt(v){return {v:v,cls:'word',html:'<b>'+v+'</b>'};}
function txtSet(ans,pool,n){
  var ch=shuffle([ans].concat(shuffle(pool).slice(0,(n||3)-1))),long=ch.some(function(x){return String(x).length>8;});
  return {opts:ch.map(txtOpt),optsCls:long?'one':''};
}
function optsBig(ans){
  var c=[ans+10,ans-10,ans+1,ans-1,ans+2,ans-2].filter(function(v){return v>=0&&v<=100&&v!==ans;});
  return [ans].concat(shuffle(c).slice(0,2)).sort(function(a,b){return a-b;});
}
function nearOpts(ans,deltas,lo,hi){
  var c=deltas.map(function(d){return ans+d;}).filter(function(v){return v>=lo&&v<=hi&&v!==ans;});
  return [ans].concat(shuffle(c).slice(0,2)).sort(function(a,b){return a-b;});
}
function blocks(n){
  var t=Math.floor(n/10),u=n%10,a='',b='',i;
  for(i=0;i<t;i++)a+='<span class="rod"></span>';
  for(i=0;i<u;i++)b+='<span class="unit"></span>';
  return '<div class="blocks"><div class="tens">'+a+'</div><div class="ones">'+b+'</div></div>';
}
function eqv(t){return '<div class="eq">'+t+'</div>';}
function rmv(n){return 'RM'+n;}
function noteHTML(v,mini){return '<span class="note note-'+v+(mini?' mini':'')+'"><b>RM'+v+'</b></span>';}
function itemTag(f,tag){return '<span class="item"><span class="fr">'+icon(FRUITS[f].icon)+'</span><span class="tag">'+tag+'</span></span>';}

var DB = {players:[], sound:true, music:true};
function load(){
  try{var raw=localStorage.getItem(STORE_KEY);if(raw){var d=JSON.parse(raw);if(d&&Array.isArray(d.players))DB=d;}}catch(e){}
  if(typeof DB.sound!=='boolean')DB.sound=true;
  if(typeof DB.music!=='boolean')DB.music=true;

}

/* ================= PROGRESS RULES ================= */
function zkey(p,z){return p.age+':'+z;}
function starsOf(p,z){var a=(p.progress&&p.progress[zkey(p,z)])||[];var r=[];for(var i=0;i<LEVELS_PER_ZONE;i++)r.push(a[i]||0);return r;}
function sumArr(a){return a.reduce(function(x,y){return x+y;},0);}
function hasContent(p,z){return !!LEVELS[zkey(p,z)];}
function zoneDone(p,z){return hasContent(p,z)&&starsOf(p,z).every(function(s){return s>=PASS;});}
function zoneState(p,zi){
  var zs=WORLDS[AGES[p.age].world].zones,z=zs[zi];
  var open=UJI||zi===0||zoneDone(p,zs[zi-1]);
  if(!open)return 'locked';
  return hasContent(p,z)?'open':'soon';
}
function levelOpen(p,z,i){return UJI||i===0||starsOf(p,z)[i-1]>=PASS;}
function totalStars(p){var t=0,pr=p.progress||{};Object.keys(pr).forEach(function(k){if(k.split(':')[0]===String(p.age))t+=sumArr(pr[k]);});return t;}
function starsFor(m){return m===0?3:(m<=2?2:1);}

var ac=null;
function audio(){
  if(ac===null){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=false;}}
  if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}
  return ac;
}
function tone(f,t0,d,type,vol){
  if(!DB.sound)return;var a=audio();if(!a)return;
  try{var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);}catch(e){}
}

  tap:function(){tone(660,0,.06,'sine',.08);},
  count:function(n){tone(440*Math.pow(1.0595,n*2),0,.12,'triangle',.1);},
  coin:function(){tone(1320,0,.07,'triangle',.1);tone(1760,.04,.12,'triangle',.08);},
  good:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.08,.2,'sine',.12);});},
  soft:function(){tone(330,0,.18,'triangle',.08);tone(262,.12,.26,'triangle',.07);},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.11,.3,'sine',.13);});}
};

var SONG=[
 ['C',[[72,1],[76,1],[79,2],[76,1],[74,1],[72,2]]],['Am',[[69,1],[72,1],[76,2],[74,1],[72,1],[69,2]]],
 ['F',[[69,1],[72,1],[77,2],[76,1],[74,1],[72,2]]],['G',[[71,1],[74,1],[79,2],[77,1],[76,1],[74,2]]],

 ['F',[[69,1],[72,1],[74,1],[77,1],[76,2],[74,2]]],['G',[[74,2],[71,2],[67,2],[0,2]]],

];

 ['Am',[[69,2],[72,2],[76,2],[74,2]]],['F',[[72,2],[69,2],[65,2],[0,2]]],
 ['C',[[67,2],[72,2],[76,2],[79,2]]],['G',[[74,4],[71,2],[67,2]]],

];
var M={on:false,bus:null,timer:null,bar:0,next:0,noise:null,space:false,song:SONG};
function hz(m){return 440*Math.pow(2,(m-69)/12);}
function mnote(m,t,d,type,vol){
  var a=ac;if(!a||!M.bus||!m)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(hz(m),t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(M.bus);o.start(t);o.stop(t+d+0.05);
}
function shaker(t,vol){
  var a=ac;if(!a||!M.bus)return;
  if(!M.noise){var len=Math.floor(a.sampleRate*0.06),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);M.noise=buf;}
  var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=M.noise;f.type='highpass';f.frequency.value=6000;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(M.bus);s.start(t);
}
function scheduleBar(i,t){
  var bar=M.song[i],ch=CH[bar[0]],e=EIGHTH;
  if(M.space){
    mnote(ch[0],t,e*7,'sine',0.1);
    for(var a=0;a<8;a++)mnote(ch[1][a%3]+12,t+e*a,e*0.9,'triangle',a%2?0.016:0.024);
    for(var k2=0;k2<8;k2+=2)shaker(t+e*k2,0.014);
    var ps=0;bar[1].forEach(function(nl){if(nl[0]){mnote(nl[0],t+ps*e,e*nl[1]*0.95,'sine',0.085);mnote(nl[0],t+ps*e+e*0.75,e*nl[1]*0.6,'sine',0.02);}ps+=nl[1];});
    return;
  }
  mnote(ch[0],t,e*3.5,'triangle',0.09);mnote(ch[0]+7,t+e*4,e*3.5,'triangle',0.07);
  [2,6].forEach(function(k){ch[1].forEach(function(n){mnote(n,t+e*k,e*1.6,'triangle',0.022);});});
  for(var k=0;k<8;k++)shaker(t+e*k,k%2?0.018:0.03);
  var pos=0;bar[1].forEach(function(nl){
    if(nl[0]){mnote(nl[0],t+pos*e,e*nl[1]*0.95,'triangle',0.075);mnote(nl[0]+12,t+pos*e,e*nl[1]*0.6,'sine',0.018);}
    pos+=nl[1];
  });
}
function musicTick(){
  if(!M.on||!ac)return;
  while(M.next<ac.currentTime+0.6){scheduleBar(M.bar,M.next);M.next+=EIGHTH*8;M.bar=(M.bar+1)%M.song.length;}
}
function startMusic(){
  if(M.on||!DB.music)return;var a=audio();if(!a)return;
  try{M.bus=a.createGain();M.bus.gain.setValueAtTime(0.0001,a.currentTime);M.bus.gain.exponentialRampToValueAtTime(0.9,a.currentTime+1.2);M.bus.connect(a.destination);}catch(e){return;}
  M.space=inWorld()&&isSpace();M.song=M.space?SONG_SPACE:SONG;
  M.on=true;M.bar=0;M.next=a.currentTime+0.1;musicTick();M.timer=setInterval(musicTick,120);
}
function stopMusic(){
  if(!M.on)return;M.on=false;clearInterval(M.timer);
  var b=M.bus;M.bus=null;
  if(b&&ac){try{b.gain.cancelScheduledValues(ac.currentTime);b.gain.setValueAtTime(b.gain.value,ac.currentTime);b.gain.linearRampToValueAtTime(0,ac.currentTime+0.3);setTimeout(function(){try{b.disconnect();}catch(e){}},500);}catch(e){}}
}
document.addEventListener('visibilitychange',function(){
  if(!ac)return;
  try{if(document.hidden)ac.suspend();else{ac.resume();if(M.on)M.next=Math.max(M.next,ac.currentTime+0.1);}}catch(e){}
});

var S={screen:'splash',pid:null,zone:null,lvl:0,run:null,manage:false,confirmDel:null,newAge:6,locked:false};
var app=document.getElementById('app'),layer=document.getElementById('layer');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function player(){return DB.players.filter(function(p){return p.id===S.pid;})[0]||null;}
function star(on,cls){return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 24 24" aria-hidden="true"><use href="#'+(on?'i-star':'i-staroff')+'"/></svg>';}
function sym(id,cls){return '<svg viewBox="0 0 24 24" aria-hidden="true"'+(cls?' class="'+cls+'"':'')+'><use href="#'+id+'"/></svg>';}
function muteBtn(){return '<button class="rb" type="button" data-act="music" aria-label="Muzik" aria-pressed="'+DB.music+'">'+sym(DB.music?'i-music':'i-musicoff')+'</button>'+
  '<button class="rb" type="button" data-act="mute" aria-label="Kesan bunyi" aria-pressed="'+DB.sound+'">'+sym(DB.sound?'i-sound':'i-mute')+'</button>';}
function reduced(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}
function flash(el,cls,ms){if(!el)return;el.classList.remove(cls);void el.getBoundingClientRect();el.classList.add(cls);setTimeout(function(){el.classList.remove(cls);},ms);}
var toastT=null;
function toast(msg){
  var old=document.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastT);toastT=setTimeout(function(){t.remove();},2800);
}
function burst(el,count){
  if(reduced()||!el||!document.body.animate)return;
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,n=count||10;
  for(var i=0;i<n;i++){
    var s=document.createElement('div');s.className='spark';s.innerHTML='<svg viewBox="0 0 24 24"><use href="#i-star"/></svg>';document.body.appendChild(s);
    var a=Math.PI*2*i/n+Math.random()*.4,d=50+Math.random()*60,x=cx-9,y=cy-9;
    var an=s.animate([{transform:'translate('+x+'px,'+y+'px) scale(.3)',opacity:1},
      {transform:'translate('+(x+Math.cos(a)*d)+'px,'+(y+Math.sin(a)*d-24)+'px) scale(1) rotate(180deg)',opacity:1,offset:.6},
      {transform:'translate('+(x+Math.cos(a)*d*1.1)+'px,'+(y+Math.sin(a)*d*1.1+20)+'px) scale(.2)',opacity:0}],{duration:850+Math.random()*300,easing:'ease-out'});
    an.onfinish=(function(nd){return function(){nd.remove();};})(s);
  }
}
var DEPTH={players:0,add:1,gate:1,map:1,path:2,parent:2,play:3},hd=0,hIgnore=0;
function hSync(d){try{if(!history.pushState)return;if(d>hd){history.pushState({d:d},'');hd=d;}else if(d===hd){history.replaceState({d:d},'');}else{var n=hd-d;hd=d;hIgnore++;history.go(-n);}}catch(e){}}
function backTarget(){var m={add:'players',gate:'players',parent:'players',map:'players',path:'map'};return m[S.screen]||null;}
window.addEventListener('popstate',function(){
  if(hIgnore>0){hIgnore--;return;}
  if(S.screen==='players'||S.screen==='splash'){hd=0;return;}
  hd=Math.max(0,hd-1);
  if(S.screen==='play'){
    try{history.pushState({d:hd+1},'');hd++;}catch(e){}
    var sh=layer.querySelector('.sheet');
    if(!sh){var q=document.querySelector('[data-act="quit"]');if(q)q.click();}
    else if(sh.getAttribute('aria-label')==='Keputusan tahap'){S.run=null;go('path');}
    else layer.innerHTML='';
    return;
  }
  var t=backTarget();if(t){S.manage=false;S.confirmDel=null;go(t);}
});
function go(screen){S.screen=screen;if(DEPTH[screen]!==undefined)hSync(DEPTH[screen]);if(screen!=='parent'&&screen!=='gate'){S.parentOK=false;S.pconfirm=null;}hush();layer.innerHTML='';render();window.scrollTo(0,0);}
function syncWorld(){
  var sp=inWorld()&&isSpace();document.body.classList.toggle('night',sp);
  if(M.on&&M.space!==sp){stopMusic();setTimeout(startMusic,380);}
}
function applyScale(){
  var w=window.innerWidth,h=window.innerHeight,wide=w>=640&&w>h,z;
  if(wide){z=S.screen==='play'?Math.min(w/960,h/600):Math.min(w/520,h/700);z=Math.max(.85,Math.min(z,1.6));}
  else if(w>=600){z=Math.max(1,Math.min(1.6,w/520,h/880));}
  else z=Math.min(1,w/380);
  document.documentElement.style.setProperty('--z',String(Math.round(z*100)/100));
}
window.addEventListener('resize',function(){applyScale();});
window.addEventListener('orientationchange',function(){setTimeout(applyScale,120);});
function render(){
  applyScale();syncWorld();
  if(S.screen==='players')app.innerHTML=vPlayers();
  else if(S.screen==='add')app.innerHTML=vAdd();
  else if(S.screen==='map')app.innerHTML=vMap();
  else if(S.screen==='path'){app.innerHTML=vPath();afterPath();}
  else if(S.screen==='play'){app.innerHTML=vPlay();afterPlay();}
  else if(S.screen==='gate')app.innerHTML=vGate();
  else if(S.screen==='parent'){if(!S.parentOK){S.screen='players';app.innerHTML=vPlayers();}else app.innerHTML=vParent();}
}

function vAdd(){
  return '<section class="screen" aria-label="Pemain baru">'+
    '<div class="top"><button class="rb" type="button" data-act="toPlayers" aria-label="Kembali">'+sym('i-back')+'</button><div class="grow"></div>'+muteBtn()+'</div>'+
    '<form class="formcard" id="addForm" novalidate><h1>Pemain baru</h1>'+
    '<div class="field"><label class="lbl" for="pName">Nama</label><input class="name-in" id="pName" name="pName" maxlength="12" autocomplete="off" placeholder="Contoh: Amin"></div>'+
    '<div class="field"><span class="lbl" id="ageLbl">Umur</span><div class="ages" role="group" aria-labelledby="ageLbl">'+
    [6,7,8].map(function(a){return '<button type="button" class="agebtn" data-act="age" data-age="'+a+'" aria-pressed="'+(S.newAge===a)+'"><b>'+a+'</b><span>tahun<br>'+AGES[a].label+'</span></button>';}).join('')+
    '</div></div><p class="err" id="addErr" role="alert"></p>'+
    '<button class="btn primary" type="submit">Simpan dan main</button></form></section>';
}
function vMap(){
  var p=player(),w=WORLDS[AGES[p.age].world],night=AGES[p.age].world==='angkasa';
  if(night)document.body.classList.add('night');
  var places=w.zones.map(function(z,zi){
    var st=zoneState(p,zi),Z=ZONES[z],zs=sumArr(starsOf(p,z));
    var sub=st==='locked'?'Habiskan '+ZONES[w.zones[zi-1]].name+' dulu':(st==='soon'?Z.subject+' · Akan datang':Z.subject);
    return '<button class="place '+st+'" type="button" data-act="zone" data-z="'+z+'" data-st="'+st+'" style="left:'+Z.x+'%;top:'+Z.y+'%">'+
      '<span class="art">'+ART[Z.art]+(st==='locked'?'<span class="lock">'+sym('i-lock')+'</span>':'')+(st==='soon'?'<span class="soonflag">Akan datang</span>':'')+'</span>'+
      '<span class="plabel"><b>'+Z.name+'</b><span>'+sub+'</span>'+(st==='open'?'<span class="pst">'+star(true)+zs+' / '+(LEVELS_PER_ZONE*3)+'</span>':'')+'</span></button>';
  }).join('');
  return '<section class="screen" aria-label="Peta">'+
    '<div class="top"><button class="rb" type="button" data-act="toPlayers" aria-label="Kembali ke senarai pemain">'+sym('i-back')+'</button><button class="who" type="button" data-act="toPlayers" aria-label="Tukar pemain"><span class="avatar" style="background:'+p.color+'">'+esc(p.name.charAt(0).toUpperCase())+'</span><span>'+esc(p.name)+'</span></button>'+
    '<div class="grow"></div><div class="starchip">'+star(true)+totalStars(p)+'</div>'+muteBtn()+'</div>'+
    '<div class="world-title"><h1>'+w.name+(UJI?'<span class="uji">Mod uji</span>':'')+'</h1><p>'+w.tag+' · '+p.age+' tahun</p></div>'+
    '<div class="map">'+(night?nightMap():dayMap())+places+'</div></section>';
}

function nightMap(){
  var st='';for(var i=0;i<46;i++){st+='<circle class="n-star" cx="'+((i*73)%400)+'" cy="'+((i*137)%540)+'" r="'+(i%5===0?2:1.1)+'" opacity="'+(0.4+(i%4)*.15)+'"/>';}
  return '<svg viewBox="0 0 400 540" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect class="n-sky" width="400" height="540"/>'+st+
    '<circle class="n-planet" cx="330" cy="70" r="32"/><ellipse class="n-ring" cx="330" cy="70" rx="50" ry="12" transform="rotate(-15 330 70)"/><circle class="n-moon" cx="60" cy="470" r="18"/>'+

function vPath(){
  var p=player(),z=S.zone,Z=ZONES[z],L=LEVELS[zkey(p,z)],stars=starsOf(p,z);
  var X=[50,76,50,24],top=70,step=104,H=top+(LEVELS_PER_ZONE-1)*step+100,pts=[];
  for(var i=0;i<LEVELS_PER_ZONE;i++)pts.push([X[i%4],top+i*step]);
  var d='M'+pts[0][0]+' '+pts[0][1];
  for(i=1;i<pts.length;i++)d+=' C'+pts[i-1][0]+' '+(pts[i-1][1]+step/2)+' '+pts[i][0]+' '+(pts[i][1]-step/2)+' '+pts[i][0]+' '+pts[i][1];
  var cur=-1;for(i=0;i<LEVELS_PER_ZONE;i++){if(levelOpen(p,z,i)&&stars[i]<PASS){cur=i;break;}}
  var stops=pts.map(function(pt,i){
    var open=levelOpen(p,z,i),s=stars[i],cls=!open?'locked':(s>=PASS?'pass':'')+(i===cur?' now':'');

function parseCode(s){
  s=(s||'').trim();if(s.indexOf('SICILIK1:')!==0)return null;
  var d;try{d=JSON.parse(decodeURIComponent(escape(atob(s.slice(9).replace(/\s+/g,'')))));}catch(e){return null;}
  if(!d||!Array.isArray(d.players))return null;
  var ps=d.players.filter(function(p){return p&&typeof p.name==='string'&&p.name&&AGES[+p.age];}).slice(0,MAX_PLAYERS).map(function(p){
    var pr={};if(p.progress&&typeof p.progress==='object')Object.keys(p.progress).forEach(function(k){if(Array.isArray(p.progress[k]))pr[k]=p.progress[k].slice(0,LEVELS_PER_ZONE).map(function(n){return Math.max(0,Math.min(3,Math.round(+n||0)));});});
    var o={id:String(p.id||('p'+Math.random().toString(36).slice(2,8))).slice(0,20),name:p.name.slice(0,12),age:+p.age,color:PLAYER_COLORS.indexOf(p.color)>=0?p.color:PLAYER_COLORS[0],progress:pr};
    if(p.stats&&typeof p.stats==='object')o.stats={plays:+p.stats.plays||0,last:+p.stats.last||0,lv:(p.stats.lv&&typeof p.stats.lv==='object')?p.stats.lv:{}};
    return o;
  });
  if(!ps.length)return null;
  return {players:ps,sound:d.sound!==false,music:d.music!==false};
}

function finish(){
  var p=player(),r=S.run,s=starsFor(r.mistakes),k=zkey(p,S.zone);
  p.progress=p.progress||{};var arr=p.progress[k]||[];while(arr.length<LEVELS_PER_ZONE)arr.push(0);
  var wasDone=zoneDone(p,S.zone),prev=arr[S.lvl];
  arr[S.lvl]=Math.max(prev,s);p.progress[k]=arr;
  p.stats=p.stats||{plays:0,last:0,lv:{}};p.stats.lv=p.stats.lv||{};
  var sk=k+'#'+S.lvl,rec=p.stats.lv[sk]||{a:0,m:0};rec.a++;rec.m=r.mistakes;p.stats.lv[sk]=rec;p.stats.plays=(p.stats.plays||0)+1;p.stats.last=Date.now();
  persist();
  var nowDone=zoneDone(p,S.zone),last=S.lvl===LEVELS_PER_ZONE-1,pass=s>=PASS;
  var zs=WORLDS[AGES[p.age].world].zones,zi=zs.indexOf(S.zone),nextZ=zs[zi+1];

  if(s>=PASS&&prev<PASS&&!last)sub=s===3?'Tiga bintang! Tahap '+(S.lvl+2)+' dah terbuka.':sub;
  var unlock=(nowDone&&!wasDone&&nextZ)?'<p class="unlock">Zon baru terbuka: '+ZONES[nextZ].name+'!</p>':'';
  var btns='';
  if(pass&&!last)btns+='<button class="btn primary" type="button" data-act="nextlvl">Tahap '+(S.lvl+2)+'</button>';
  btns+='<button class="btn '+(pass&&!last?'ghost':'primary')+'" type="button" data-act="again">Main lagi</button>';
  btns+='<button class="btn ghost" type="button" data-act="toPath">Laluan tahap</button>';
  layer.innerHTML='<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Keputusan tahap">'+
    '<div class="bigstars" id="bigstars">'+star(s>=1)+star(s>=2)+star(s>=3)+'</div><h2>'+title+'</h2><p>'+sub+'</p>'+unlock+btns+'</div></div>';
  if(s>=2){sfx.win();setTimeout(function(){burst(document.getElementById('bigstars'),14);},350);}else sfx.soft();
}

    case 'addcoin':
      if(S.locked)return;
      if(S.run.given.length>=12){say('Tangan dah penuh. Tap syiling dalam tangan untuk keluarkan.');return;}
      S.run.given.push(+b.getAttribute('data-c'));sfx.coin();renderHand();return;
    case 'rmcoin':if(S.locked)return;S.run.given.splice(+b.getAttribute('data-i'),1);sfx.tap();renderHand();return;
    case 'clearcoins':if(S.locked)return;S.run.given=[];sfx.tap();renderHand();return;
    case 'paycoins':
      if(S.locked||!S.run.given.length)return;
      var got=sumArr(S.run.given),want=S.run.qs[S.run.i].price;
      if(got===want)correct(document.getElementById('payBtn'));
      else wrong(got<want?'Belum cukup. ':'Terlebih. Tap syiling dalam tangan untuk keluarkan. ');
      return;
    case 'hint':
      if(!S.run)return;flash(kancilEl(),'happy',900);say(hintNow());S.run.hint=Math.min(S.run.hint+1,1);return;
    case 'quit':
      sfx.tap();
      layer.innerHTML='<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Keluar"><h2>Keluar dari tahap?</h2><p>Bintang tahap ini tak akan disimpan.</p>'+
        '<button class="btn primary" type="button" data-act="stay">Teruskan main</button><button class="btn ghost" type="button" data-act="toPath">Keluar</button></div></div>';
      return;
    case 'stay':layer.innerHTML='';return;
    case 'again':sfx.tap();startLevel(S.lvl);return;
    case 'nextlvl':sfx.tap();startLevel(S.lvl+1);return;
    case 'toPath':sfx.tap();S.run=null;go('path');return;
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id==='gateForm'){
    e.preventDefault();var v=(document.getElementById('gAns').value||'').trim(),er=document.getElementById('gErr');
    if(+v===S.gate.ans&&v!==''){S.parentOK=true;sfx.good();go('parent');return;}
    S.gtries=(S.gtries||0)+1;sfx.soft();
    if(S.gtries>=3){S.gate=newGate();S.gtries=0;render();var e2=document.getElementById('gErr');if(e2)e2.textContent='Salah. Ini soalan baru.';var n2=document.getElementById('gAns');if(n2)n2.focus();}
    else{er.textContent='Jawapan salah. Cuba lagi.';document.getElementById('gAns').value='';}
    return;
  }
  if(e.target.id!=='addForm')return;e.preventDefault();
  var name=(document.getElementById('pName').value||'').trim().replace(/\s+/g,' ');
  var err=document.getElementById('addErr');
  if(!name){err.textContent='Tulis nama dulu.';sfx.soft();return;}
  var used=DB.players.map(function(p){return p.color;}),color=PLAYER_COLORS.filter(function(c){return used.indexOf(c)<0;})[0]||PLAYER_COLORS[0];
  var p={id:'p'+Date.now().toString(36),name:name,age:S.newAge,color:color,progress:{}};
  DB.players.push(p);persist();S.pid=p.id;sfx.good();go('map');
});
function startLevel(i){S.lvl=i;S.run=buildRun();layer.innerHTML='';S.screen='play';hSync(DEPTH.play);hush();render();window.scrollTo(0,0);}
